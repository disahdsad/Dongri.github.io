<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>どんぐりタイピング</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23ffffff' d='M45,10 C42,15 35,12 30,18 C25,24 28,32 22,35 C15,38 10,32 5,42 C12,42 16,46 20,43 C24,40 25,35 30,36 C28,42 22,46 18,52 C24,52 30,48 34,44 C32,50 28,55 24,62 C32,58 38,52 42,46 C40,54 36,62 30,72 C40,66 48,58 52,48 C50,58 44,68 36,82 C48,74 58,64 62,50 C65,40 60,32 65,24 C70,16 80,20 85,12 C78,16 74,12 70,18 C66,24 68,32 62,35 C58,37 54,32 50,34 C54,28 56,22 54,16 C52,22 48,25 45,10 Z M65,48 C72,52 82,50 90,56 C82,56 76,58 72,62 C78,65 86,68 95,74 C84,72 76,70 70,66 C68,72 64,80 58,88 C62,80 64,74 65,66 C60,64 54,64 48,66 C54,62 60,60 65,48 Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141812;
    --panel:#1c2419;
    --panel-edge: rgba(160,115,70,0.22);
    --gold:#a07346;
    --gold-soft:#d2b48c;
    --paper:#f5eedc;
    --jade:#789c68;
    --vermillion:#c1554b;
    --muted:#727c6b;
    --text:#efe8d8;
    --achievement-gold:#ffd700;
    --achievement-silver:#c0c0c0;
    --achievement-bronze:#cd7f32;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--ink);
    color:var(--text);
    font-family:'Zen Maru Gothic', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{ position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  .screen{ width:100%; max-width:640px; padding:32px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .hidden{ display:none !important; }

  /* ---------- Forest Background Canvas Layer ---------- */
  #forest-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }

  /* ---------- Acorn particles canvas layer ---------- */
  #acorn-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 150;
  }

  /* ---------- Hanko highscore badge ---------- */
  .hanko{
    position:fixed; top:20px; left:20px;
    width:94px; height:94px;
    border-radius:50%;
    border:3px solid var(--gold);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-6deg);
    background:rgba(160,115,70,0.12);
    box-shadow: inset 0 0 0 1px rgba(160,115,70,0.3), 0 4px 12px rgba(0,0,0,0.4);
    z-index: 50;
    transition: opacity 0.3s ease, transform 0.3s ease;
    cursor: pointer;
  }
  .hanko:hover{ transform:rotate(-6deg) scale(1.05); }
  .hanko.hidden-ui{
    opacity: 0; pointer-events: none; transform: scale(0.9) rotate(-6deg);
  }
  .hanko-label{ font-size:12px; font-weight:700; letter-spacing:2px; color:var(--gold-soft); opacity:0.9; }
  .hanko-score{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:24px; font-weight:700; color:var(--gold-soft);
    line-height:1.1;
  }
  .hanko-sub{
    font-size:9px; color:var(--muted); margin-top:2px;
  }

  /* ---------- Top Navigation ---------- */
  .top-nav{
    position:fixed; top:20px; right:20px;
    display:flex; gap:10px; z-index:50;
    align-items:center;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .top-nav.hidden-ui{
    opacity: 0; pointer-events: none; transform: scale(0.9);
  }
  .nav-btn {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--gold-soft);
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .nav-btn:hover {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }
  .nav-btn.achievement-btn {
    border-color: var(--achievement-gold);
    color: var(--achievement-gold);
  }
  .nav-btn.achievement-btn:hover {
    background: var(--achievement-gold);
    color: var(--ink);
  }

  /* ---------- Achievement Toast ---------- */
  #achievement-toast {
    position: fixed; top: 80px; right: 20px;
    background: var(--panel);
    border: 2px solid var(--achievement-gold);
    border-radius: 12px;
    padding: 16px 24px;
    z-index: 300;
    transform: translateX(120%);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    max-width: 320px;
    pointer-events: none;
  }
  #achievement-toast.show {
    transform: translateX(0);
  }
  #achievement-toast .toast-title {
    font-size: 14px;
    color: var(--muted);
  }
  #achievement-toast .toast-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--achievement-gold);
  }
  #achievement-toast .toast-desc {
    font-size: 13px;
    color: var(--text);
    opacity: 0.8;
  }

  /* ---------- Achievement Modal ---------- */
  #achievement-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 24, 18, 0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #achievement-overlay.active {
    opacity: 1; pointer-events: auto;
  }
  .achievement-card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    padding: 32px 36px;
    display: flex; flex-direction: column;
    width: 100%; max-width: 560px;
    max-height: 80vh;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    transform: translateY(16px);
    transition: transform 0.3s ease;
    z-index: 201;
    overflow-y: auto;
  }
  #achievement-overlay.active .achievement-card {
    transform: translateY(0);
  }
  .achievement-title {
    font-size: 22px; font-weight: 700; color: var(--text);
    margin: 0 0 4px 0; letter-spacing: 0.05em;
  }
  .achievement-stats {
    font-size: 14px; color: var(--muted);
    margin-bottom: 16px;
  }
  .achievement-stats span {
    background: rgba(160,115,70,0.15);
    padding: 4px 14px;
    border-radius: 12px;
    margin-right: 10px;
  }
  .achievement-list {
    display: flex; flex-direction: column; gap: 10px;
  }
  .achievement-item {
    display: flex; align-items: center;
    background: rgba(0,0,0,0.2);
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid transparent;
    transition: border-color 0.2s;
    gap: 14px;
  }
  .achievement-item.unlocked {
    border-color: var(--achievement-gold);
    background: rgba(255,215,0,0.08);
  }
  .achievement-item.locked {
    opacity: 0.4;
    background: rgba(0,0,0,0.4);
  }
  .achievement-item.locked .achievement-name,
  .achievement-item.locked .achievement-desc {
    color: #222;
    filter: blur(3px);
    user-select: none;
  }
  .achievement-icon {
    font-size: 28px;
    width: 44px;
    text-align: center;
    flex-shrink: 0;
  }
  .achievement-item.locked .achievement-icon {
    filter: grayscale(1) brightness(0.2);
  }
  .achievement-info {
    flex: 1;
  }
  .achievement-name {
    font-size: 15px; font-weight: 700; color: var(--text);
  }
  .achievement-desc {
    font-size: 12px; color: var(--muted);
  }
  .achievement-status {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .achievement-status.unlocked {
    color: var(--achievement-gold);
    background: rgba(255,215,0,0.15);
  }
  .achievement-status.locked {
    color: var(--muted);
    background: rgba(0,0,0,0.3);
  }

  .achievement-close-btn {
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 8px 24px;
    border-radius: 6px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    margin-top: 16px;
    align-self: center;
  }
  .achievement-close-btn:hover {
    border-color: var(--text);
    color: var(--text);
  }

  /* ---------- Shop/Setting Modal Overlay ---------- */
  #shop-overlay, #settings-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 24, 18, 0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #shop-overlay.active, #settings-overlay.active {
    opacity: 1; pointer-events: auto;
  }
  .shop-card, .settings-card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    padding: 32px 36px;
    display: flex; flex-direction: column;
    width: 100%; max-width: 520px;
    max-height: 80vh;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    transform: translateY(16px);
    transition: transform 0.3s ease;
    z-index: 201;
    overflow-y: auto;
  }
  #shop-overlay.active .shop-card,
  #settings-overlay.active .settings-card {
    transform: translateY(0);
  }
  .shop-title, .settings-title { font-size: 22px; font-weight: 700; color: var(--text); margin: 0 0 4px 0; letter-spacing: 0.05em; }
  .shop-subtitle { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
  .shop-currency {
    display: flex; gap: 20px; margin-bottom: 16px;
    font-size: 14px; color: var(--gold-soft);
  }
  .shop-currency span{ background:rgba(160,115,70,0.15); padding:4px 14px; border-radius:12px; }
  .shop-warning {
    font-size: 12px; color: var(--vermillion); 
    background: rgba(193,85,75,0.1); 
    padding: 8px 14px; border-radius: 8px;
    margin-bottom: 16px;
    border: 1px solid rgba(193,85,75,0.2);
    text-align: center;
  }
  .shop-section-title{
    font-size:16px; font-weight:700; color:var(--text);
    margin:16px 0 12px 0; padding-bottom:8px;
    border-bottom:1px solid var(--panel-edge);
  }
  .shop-items{ display:flex; flex-direction:column; gap:10px; }
  .shop-item{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(0,0,0,0.2); padding:12px 16px; border-radius:10px;
    border:1px solid transparent; transition:border-color 0.2s;
  }
  .shop-item.owned{ border-color:var(--jade); background:rgba(120,156,104,0.1); }
  .shop-item.equipped{ border-color:var(--gold); background:rgba(160,115,70,0.15); }
  .shop-item-info{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; flex:1; }
  .shop-item-name{ font-size:15px; font-weight:700; color:var(--text); }
  .shop-item-desc{ font-size:12px; color:var(--muted); }
  .shop-item-price{ font-size:13px; color:var(--gold-soft); margin-right:12px; }
  .shop-item-btn{
    background:var(--gold); border:none; color:var(--ink);
    padding:6px 16px; border-radius:6px;
    font-family:'Zen Maru Gothic', sans-serif; font-size:13px; font-weight:700;
    cursor:pointer; transition:opacity 0.2s;
    white-space:nowrap;
  }
  .shop-item-btn:hover{ opacity:0.8; }
  .shop-item-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .shop-item-btn.equip-btn{ background:var(--jade); }
  .shop-item-btn.owned-btn{ background:var(--muted); }

  .shop-close-btn, .settings-close-btn {
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 8px 24px;
    border-radius: 6px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    margin-top: 16px;
    align-self:center;
  }
  .shop-close-btn:hover, .settings-close-btn:hover {
    border-color: var(--text);
    color: var(--text);
  }

  /* ---------- 設定項目 ---------- */
  .setting-group {
    width: 100%;
    margin: 4px 0;
  }
  .setting-group label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
    text-align: left;
  }
  .setting-group .sound-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .setting-group .sound-row input[type="text"] {
    flex: 1;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--panel-edge);
    background: var(--ink);
    color: var(--text);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    transition: border-color 0.2s;
    min-width: 0;
  }
  .setting-group .sound-row input[type="text"]:focus {
    outline: none;
    border-color: var(--gold);
  }
  .setting-group .sound-row input[type="text"]::placeholder {
    color: var(--muted);
    opacity: 0.5;
  }
  .setting-group .sound-exec-btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--gold);
    background: var(--gold);
    color: var(--ink);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .setting-group .sound-exec-btn:hover {
    opacity: 0.8;
  }
  .setting-group .sound-status {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    min-height: 18px;
  }
  .setting-group .sound-status.success {
    color: var(--jade);
  }
  .setting-group .sound-status.error {
    color: var(--vermillion);
  }

  /* ---------- Menu ---------- */
  .menu-center{ display:flex; flex-direction:column; align-items:center; gap:20px; width:100%; z-index:20; position:relative; }
  .title{
    font-size:clamp(34px,7vw,52px);
    font-weight:700;
    margin:0;
    letter-spacing:0.08em;
    position:relative;
    padding-bottom:16px;
    color: var(--gold-soft);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .title::after{
    content:"";
    position:absolute; bottom:0; left:50%;
    width:120px; height:4px;
    background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold-soft) 50%, var(--gold) 80%, transparent);
    transform:translateX(-50%) skewX(-18deg);
    border-radius:2px;
  }
  .tagline{
    font-size:15px; line-height:1.9; color:var(--muted);
    max-width:420px; margin:0;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .start-prompt{
    margin-top:8px;
    display:flex; align-items:center; gap:10px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14px; color:var(--gold-soft);
    padding:10px 20px;
    border:1px solid var(--panel-edge);
    border-radius:8px;
    background:rgba(28,36,25,0.8);
    backdrop-filter: blur(4px);
  }
  kbd{
    font-family:'Zen Maru Gothic', sans-serif;
    background:var(--ink);
    border:1px solid var(--gold);
    color:var(--gold-soft);
    padding:4px 10px;
    border-radius:5px;
    font-size:13px;
    font-weight:700;
  }

  /* ---------- Game ---------- */
  #game-screen{ max-width:720px; z-index:20; position:relative; }
  .hud{
    width:100%; display:flex; justify-content:space-between; align-items:flex-start;
    font-family:'Zen Maru Gothic', sans-serif;
    margin-bottom:36px;
  }
  .hud-timer{ display:flex; align-items:baseline; gap:4px; color:var(--text); }
  #timer{ font-size:34px; font-weight:700; }
  .hud-timer.low #timer{ color:var(--vermillion); }
  .hud-unit{ font-size:13px; color:var(--muted); }
  .hud-score{ text-align:right; }
  .score-value{ font-size:34px; font-weight:700; color:var(--gold-soft); }
  .multiplier{ font-size:14px; color:var(--jade); margin-top:2px; }

  .word-stage{
    width:100%;
    background:rgba(28,36,25,0.85);
    backdrop-filter: blur(6px);
    border:1px solid var(--panel-edge);
    border-radius:10px;
    padding:44px 28px;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    position:relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .word-stage.shake{ animation:shake 0.22s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }
  .kana-display{ font-size:clamp(30px,6vw,44px); font-weight:700; letter-spacing:0.06em; }
  .romaji-display{ font-family:'Zen Maru Gothic', sans-serif; font-size:clamp(18px,4vw,24px); font-weight:700; letter-spacing:0.04em; }
  .ch-done{ color:var(--jade); }
  .ch-next{ color:var(--paper); border-bottom:2px solid var(--gold); }
  .ch-pending{ color:var(--muted); }

  .popup{
    position:absolute; top:-6px; left:50%; transform:translate(-50%,-100%);
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:15px; font-weight:700; color:var(--gold-soft);
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .popup.show{ opacity:1; transform:translate(-50%,-140%); }
  .esc-hint{ margin-top:26px; font-size:12px; color:var(--muted); letter-spacing:0.04em; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

  /* ---------- Result Modal ---------- */
  #result-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 24, 18, 0.85);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #result-overlay.active { opacity:1; pointer-events:auto; }
  .result-card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    padding: 48px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    transform: translateY(24px) scale(0.96);
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 101;
  }
  #result-overlay.active .result-card { transform:translateY(0) scale(1); }
  .result-title { font-size:22px; font-weight:700; color:var(--muted); margin:0; letter-spacing:0.05em; }
  .result-score-num {
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:54px; font-weight:700; color:var(--gold-soft);
    line-height:1; margin:4px 0;
  }
  .result-badge-record {
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:15px; font-weight:700; color:var(--gold-soft);
    background:rgba(160,115,70,0.15);
    border:1px solid rgba(160,115,70,0.4);
    padding:4px 14px; border-radius:20px;
    letter-spacing:0.05em;
  }
  .result-prompt {
    margin-top:16px; display:flex; gap:16px; align-items:center;
    font-family:'Zen Maru Gothic', sans-serif; font-size:13px; color:var(--muted);
  }

  @media (max-width:480px){
    .hud{ margin-bottom:24px; }
    .word-stage{ padding:32px 16px; }
    .shop-card, .settings-card, .achievement-card{ padding:20px; margin:10px; }
    #achievement-toast { max-width: 260px; padding: 12px 16px; }
    #achievement-toast .toast-name { font-size: 16px; }
    .setting-group .sound-row {
      flex-wrap: wrap;
    }
    .setting-group .sound-row input[type="text"] {
      min-width: 100%;
    }
  }
</style>
</head>
<body>
<div id="app">

  <!-- Forest Background Canvas -->
  <canvas id="forest-canvas"></canvas>
  <canvas id="acorn-canvas"></canvas>

  <!-- Achievement Toast -->
  <div id="achievement-toast">
    <div class="toast-title">🏆 実績解除</div>
    <div class="toast-name" id="toast-name">実績名</div>
    <div class="toast-desc" id="toast-desc">説明</div>
  </div>

  <div class="hanko" id="hanko-badge" title="クリックでカスタマイズ">
    <span class="hanko-label">最高</span>
    <span class="hanko-score" id="highscore-value">0</span>
    <span class="hanko-sub" id="total-typed-display">入力:0字</span>
  </div>

  <div class="top-nav" id="top-nav">
    <button id="achievement-open-btn" class="nav-btn achievement-btn">🏆 実績</button>

  // --- デフォルト音声（Web Audioで生成） ---
  function generateDefaultSound(type) {
    if (!audioCtx) return null;
    try {
      const duration = type === 'typed' ? 0.1 : type === 'start' ? 0.2 : 0.4;
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      
      if (type === 'typed') {
        for (let i = 0; i < data.length; i++) {
          const t = i / sampleRate;
          data[i] = Math.sin(2 * Math.PI * 800 * t) * Math.exp(-t * 40) * 0.3;
        }
      } else if (type === 'start') {
        for (let i = 0; i < data.length; i++) {
          const t = i / sampleRate;
          const freq = 400 + t * 600;
          data[i] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-t * 10) * 0.3;
        }
      } else if (type === 'result') {
        for (let i = 0; i < data.length; i++) {
          const t = i / sampleRate;
          const val = Math.sin(2 * Math.PI * 523 * t) * 0.15 +
                      Math.sin(2 * Math.PI * 659 * t) * 0.15 +
                      Math.sin(2 * Math.PI * 784 * t) * 0.15;
          data[i] = val * Math.exp(-t * 6) * 0.4;
        }
      }
      return buffer;
    } catch(e) {
      return null;
    }
  }

    }

  }

  async function loadSound(url) {
    if (!url) return null;
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('HTTP error: ' + response.status);
      const arrayBuffer = await response.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      return audioBuffer;
    } catch(e) {
      console.warn('音声の読み込みに失敗:', url, e);
      return null;
    }
  }

  function playSound(buffer) {
    if (!buffer || !audioCtx) return;
    try {
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
    } catch(e) {
      console.warn('音声の再生に失敗:', e);
    }
  }

    if (soundBuffers[type]) return soundBuffers[type];
    return generateDefaultSound(type);

    if (buffer) playSound(buffer);

          soundBuffers[type] = buffer;
          if (type === 'typed') soundTyped = url.trim();

          statusEl.className = 'sound-status error';
        }
      } else {
        if (type === 'typed') soundTyped = '';
        else if (type === 'start') soundStart = '';
        else if (type === 'result') soundResult = '';
        soundBuffers[type] = null;
        saveData();

  // ============ 実績システム ============
  function checkAchievements() {
    let newUnlocked = [];
    for (const [id, ach] of Object.entries(ACHIEVEMENTS)) {
      if (!unlockedAchievements.includes(id) && ach.check()) {
        unlockedAchievements.push(id);
        newUnlocked.push(ach);
      }
    }
    if (newUnlocked.length > 0) {
      saveData();
      const last = newUnlocked[newUnlocked.length - 1];
      showAchievementToast(last);
      updateAchievementUI();
    }
  }

  function showAchievementToast(ach) {
    toastName.textContent = ach.name;
    toastDesc.textContent = ach.desc;
    toastEl.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toastEl.classList.remove('show');
    }, 4000);
  }

  function updateAchievementUI() {
    const total = Object.keys(ACHIEVEMENTS).length;
    achUnlockedCount.textContent = unlockedAchievements.length;
    achTotalCount.textContent = total;
    achTotalTyped.textContent = totalTyped;

    let html = '';
    for (const [id, ach] of Object.entries(ACHIEVEMENTS)) {
      const unlocked = unlockedAchievements.includes(id);
      html += `
        <div class="achievement-item ${unlocked ? 'unlocked' : 'locked'}">
          <div class="achievement-icon">${unlocked ? ach.icon : '❓'}</div>
          <div class="achievement-info">
            <div class="achievement-name">${unlocked ? ach.name : '？？？'}</div>
            <div class="achievement-desc">${unlocked ? ach.desc : '？？？'}</div>
          </div>
          <div class="achievement-status ${unlocked ? 'unlocked' : 'locked'}">
            ${unlocked ? '✅ 解除済' : '🔒 未解除'}
          </div>
        </div>
      `;
    }
    achievementList.innerHTML = html;
  }

  // ============ 背景描画システム ============
  function initForest() {
    forestCanvas.width = window.innerWidth;
    forestCanvas.height = window.innerHeight;
    trees = [];
    const count = Math.floor(window.innerWidth / 70) + 5;
    for(let i = 0; i < count; i++) {
      trees.push({
        x: (i / count) * window.innerWidth + (Math.random() - 0.5) * 50,
        height: 180 + Math.random() * 250,
        width: 30 + Math.random() * 40,
        layer: Math.random() > 0.5 ? 1 : 2,
        sway: Math.random() * Math.PI * 2,
        swaySpeed: 0.01 + Math.random() * 0.015,
        color: Math.random() > 0.7 ? 'sakura' : 'normal'
      });
    }
  }

  function drawForest() {
    fCtx.clearRect(0, 0, forestCanvas.width, forestCanvas.height);

    const bg = BG_SKINS[equippedBg] || BG_SKINS['forest'];
    let colors;
    switch(equippedBg) {
      case 'sunset':
        colors = ['#1a0a0a', '#3d1a0a', '#6b2a15'];
        break;
      case 'ocean':
        colors = ['#0a1a2a', '#0d2a4a', '#1a4a6a'];
        break;
      case 'everest':
        colors = ['#0a1a3a', '#1a3a6a', '#3a7aaa'];
        break;
      case 'sakura':
        colors = ['#1a0a1a', '#3a1a2a', '#5a2a3a'];
        break;
      case 'aurora':
        colors = ['#0a0a1a', '#1a0a3a', '#0a2a3a'];
        break;
      case 'nightcity':
        colors = ['#0a0a14', '#1a0a28', '#2a0a3a'];
        break;
      case 'waterfall':
        colors = ['#0a1a0a', '#1a3a1a', '#2a5a2a'];
        break;
      case 'desert':
        colors = ['#1a0a0a', '#3a2a0a', '#5a3a0a'];
        break;
      case 'starry':
        colors = ['#050510', '#0a0a25', '#0a0a3a'];
        break;
      default:
        colors = ['#0d120a', '#182215'];
    }

    const bgGrad = fCtx.createLinearGradient(0, 0, 0, forestCanvas.height);
    bgGrad.addColorStop(0, colors[0]);
    bgGrad.addColorStop(0.5, colors[1] || colors[0]);
    bgGrad.addColorStop(1, colors[2] || colors[1] || colors[0]);
    fCtx.fillStyle = bgGrad;
    fCtx.fillRect(0, 0, forestCanvas.width, forestCanvas.height);

    trees.forEach(t => {
      t.sway += t.swaySpeed;
      const swayOffset = Math.sin(t.sway) * 4;

      fCtx.save();
      const isSakura = (equippedBg === 'sakura' && t.color === 'sakura');
      if(t.layer === 1) {
        fCtx.fillStyle = isSakura ? 'rgba(60,30,40,0.5)' : 'rgba(25,38,22,0.45)';
      } else {
        fCtx.fillStyle = isSakura ? 'rgba(80,40,50,0.7)' : 'rgba(32,48,28,0.75)';
      }

      fCtx.beginPath();
      fCtx.moveTo(t.x - t.width * 0.2, forestCanvas.height);
      fCtx.lineTo(t.x + t.width * 0.2, forestCanvas.height);
      fCtx.lineTo(t.x + t.width * 0.1 + swayOffset * 0.5, forestCanvas.height - t.height * 0.5);
      fCtx.lineTo(t.x - t.width * 0.1 + swayOffset * 0.5, forestCanvas.height - t.height * 0.5);
      fCtx.fill();

      const crownY = forestCanvas.height - t.height * 0.6;
      if(isSakura) {
        fCtx.fillStyle = 'rgba(200,120,140,0.6)';
        for(let j=0; j<5; j++) {
          const angle = (j/5)*Math.PI*2 + t.sway*0.1;
          fCtx.beginPath();
          fCtx.arc(t.x + swayOffset + Math.cos(angle)*t.width*0.5, crownY + Math.sin(angle)*t.width*0.3, t.width*0.3, 0, Math.PI*2);
          fCtx.fill();
        }
      } else {
        fCtx.beginPath();
        fCtx.arc(t.x + swayOffset, crownY, t.width * 0.9, 0, Math.PI * 2);
        fCtx.arc(t.x - t.width * 0.4 + swayOffset, crownY + 20, t.width * 0.7, 0, Math.PI * 2);
        fCtx.arc(t.x + t.width * 0.4 + swayOffset, crownY + 20, t.width * 0.7, 0, Math.PI * 2);
        fCtx.fill();
      }
      fCtx.restore();
    });

    if(equippedBg === 'everest') {
      fCtx.save();
      fCtx.fillStyle = 'rgba(200,210,220,0.15)';
      fCtx.beginPath();
      fCtx.moveTo(0, forestCanvas.height * 0.7);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.2, forestCanvas.height * 0.3, forestCanvas.width * 0.4, forestCanvas.height * 0.5);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.5, forestCanvas.height * 0.2, forestCanvas.width * 0.6, forestCanvas.height * 0.45);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.8, forestCanvas.height * 0.35, forestCanvas.width, forestCanvas.height * 0.55);
      fCtx.lineTo(forestCanvas.width, forestCanvas.height);
      fCtx.lineTo(0, forestCanvas.height);
      fCtx.fill();

      fCtx.fillStyle = 'rgba(255,255,255,0.08)';
      fCtx.beginPath();
      fCtx.moveTo(forestCanvas.width * 0.3, forestCanvas.height * 0.5);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.45, forestCanvas.height * 0.25, forestCanvas.width * 0.55, forestCanvas.height * 0.4);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.65, forestCanvas.height * 0.3, forestCanvas.width * 0.75, forestCanvas.height * 0.45);
      fCtx.lineTo(forestCanvas.width * 0.75, forestCanvas.height);
      fCtx.lineTo(forestCanvas.width * 0.3, forestCanvas.height);
      fCtx.fill();
      fCtx.restore();
    }

    if(equippedBg === 'nightcity') {
      fCtx.save();
      for(let i=0; i<20; i++) {
        const x = Math.random() * forestCanvas.width;
        const y = forestCanvas.height * (0.5 + Math.random() * 0.4);
        const w = 3 + Math.random() * 8;
        const h = 5 + Math.random() * 20;
        fCtx.fillStyle = `rgba(255,200,50,${0.1 + Math.random() * 0.2})`;
        fCtx.fillRect(x, y, w, h);
      }
      fCtx.restore();
    }

    if(equippedBg === 'starry') {
      fCtx.save();
      for(let i=0; i<100; i++) {
        const x = Math.random() * forestCanvas.width;
        const y = Math.random() * forestCanvas.height * 0.6;
        const size = 0.5 + Math.random() * 1.5;
        const alpha = 0.3 + Math.random() * 0.7;
        fCtx.fillStyle = `rgba(255,255,255,${alpha * 0.5})`;
        fCtx.beginPath();
        fCtx.arc(x, y, size, 0, Math.PI * 2);
        fCtx.fill();
      }
      fCtx.restore();
    }

    requestAnimationFrame(drawForest);
  }

  // ============ どんぐり描画システム ============
  function resizeCanvas() {
    acornCanvas.width = window.innerWidth;
    acornCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', () => { resizeCanvas(); initForest(); });
  resizeCanvas();
  initForest();
  requestAnimationFrame(drawForest);

  function spawnAcornTop() {
    const x = Math.random() * (window.innerWidth - 60) + 30;
    const y = 15;
    acorns.push({
      x, y,
      vx: (Math.random() - 0.5) * 1.5,
      vy: Math.random() * 0.5,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.05 + Math.random() * 0.05,
      scale: 0.8 + Math.random() * 0.4,
      skin: equippedAcorn,
      bubblePhase: Math.random() * Math.PI * 2,
      hue: Math.random() * 360,
    });
  }

  function drawAcorn(ctx, a) {
    const skin = ACORN_SKINS[a.skin] || ACORN_SKINS['default'];
    const currentX = a.x + Math.sin(a.wobble) * 3;
    const currentY = a.y;

    ctx.save();
    ctx.translate(currentX, currentY);
    ctx.scale(a.scale, a.scale);

    let capColor = '#654321';
    let nutColor = '#a07346';
    let glowColor = null;

    if (a.skin === 'rainbow') {
      a.hue = (a.hue + 0.8) % 360;
      const hue1 = a.hue;
      const hue2 = (a.hue + 60) % 360;
      const hue3 = (a.hue + 120) % 360;
      
      const grad = ctx.createRadialGradient(-4, 6, 2, 0, 10, 14);
      grad.addColorStop(0, `hsl(${hue1}, 100%, 70%)`);
      grad.addColorStop(0.4, `hsl(${hue2}, 100%, 65%)`);
      grad.addColorStop(0.8, `hsl(${hue3}, 100%, 60%)`);
      grad.addColorStop(1, `hsl(${(a.hue + 180) % 360}, 100%, 50%)`);
      
      ctx.fillStyle = grad;
      ctx.shadowColor = `hsl(${a.hue}, 100%, 70%)`;
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.ellipse(0, 10, 9, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      const grad2 = ctx.createRadialGradient(0, 0, 2, 0, 3, 10);
      grad2.addColorStop(0, `hsl(${(a.hue + 30) % 360}, 100%, 75%)`);
      grad2.addColorStop(0.5, `hsl(${(a.hue + 90) % 360}, 100%, 65%)`);
      grad2.addColorStop(1, `hsl(${(a.hue + 150) % 360}, 100%, 55%)`);
      
      ctx.shadowBlur = 20;
      ctx.fillStyle = grad2;
      ctx.beginPath();
      ctx.arc(0, 3, 10, Math.PI, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      for (let i = 0; i < 4; i++) {
        const angle = a.bubblePhase + i * 1.57;
        const dist = 12 + Math.sin(a.bubblePhase * 0.5 + i) * 3;
        const size = 2 + Math.sin(a.bubblePhase * 0.7 + i * 1.2) * 1;
        const alpha = 0.4 + Math.sin(a.bubblePhase * 0.8 + i * 1.8) * 0.3;
        ctx.fillStyle = `hsla(${(a.hue + i * 90) % 360}, 100%, 90%, ${alpha})`;
        ctx.beginPath();
        const cx = Math.cos(angle) * dist;
        const cy = Math.sin(angle) * dist * 0.7 + 5;
        for (let j = 0; j < 5; j++) {
          const starAngle = (j / 5) * Math.PI * 2 - Math.PI / 2 + a.bubblePhase * 0.3;
          const r = j % 2 === 0 ? size * 1.5 : size * 0.6;
          if (j === 0) ctx.moveTo(cx + Math.cos(starAngle) * r, cy + Math.sin(starAngle) * r);
          else ctx.lineTo(cx + Math.cos(starAngle) * r, cy + Math.sin(starAngle) * r);
        }
        ctx.closePath();
        ctx.fill();
      }
      
      ctx.restore();
      return;
    }

    if (a.skin === 'ice') {
      capColor = '#3a6a8a';
      nutColor = '#8ac4e0';
      glowColor = 'rgba(138,196,224,0.4)';
    } else if (a.skin === 'dark') {
      capColor = '#2a0a3a';
      nutColor = '#6a2a8a';
      glowColor = 'rgba(106,42,138,0.4)';
    } else if (a.skin === 'light') {
      capColor = '#8a8a8a';
      nutColor = '#f0f0ff';
      glowColor = 'rgba(255,255,255,0.4)';
    } else if (a.skin === 'cosmic') {
      capColor = '#1a0a3a';
      nutColor = '#4a1a6a';
      glowColor = 'rgba(74,26,106,0.5)';
      for (let i = 0; i < 6; i++) {
        const angle = a.bubblePhase + i * 1.05;
        const dist = 10 + Math.sin(a.bubblePhase * 0.5 + i) * 4;
        const size = 1 + Math.sin(a.bubblePhase * 0.7 + i * 1.3) * 0.8;
        ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(a.bubblePhase * 0.6 + i * 1.7) * 0.3})`;
        ctx.beginPath();
        ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist * 0.6 + 5, size, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      switch(a.skin) {
        case 'green':
          capColor = '#2d5a1a';
          nutColor = '#4a8a2a';
          glowColor = 'rgba(74,138,42,0.3)';
          break;
        case 'gold':
          capColor = '#b8860b';
          nutColor = '#ffd700';
          glowColor = 'rgba(255,215,0,0.4)';
          break;
        case 'crystal':
          capColor = '#4a6a8a';
          nutColor = '#8ac4d0';
          glowColor = 'rgba(138,196,208,0.4)';
          break;
        case 'flame':
          capColor = '#8a2a0a';
          nutColor = '#ff4a1a';
          glowColor = 'rgba(255,74,26,0.4)';
          break;
        case 'bubble':
          capColor = '#2a5a3a';
          nutColor = '#4aaa6a';
          glowColor = 'rgba(74,170,106,0.3)';
          break;
        default:
          break;
      }
    }

    if(glowColor) {
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 20;
    }

    ctx.fillStyle = nutColor;
    ctx.beginPath();
    ctx.ellipse(0, 10, 9, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = capColor;
    ctx.beginPath();
    ctx.arc(0, 3, 10, Math.PI, Math.PI * 2);
    ctx.fill();

    if(a.skin === 'bubble' || a.skin === 'green') {
      a.bubblePhase += 0.05;
      for(let i=0; i<3; i++) {
        const angle = a.bubblePhase + i * 2.1;
        const radius = 14 + Math.sin(a.bubblePhase + i) * 4;
        ctx.fillStyle = `rgba(100,255,180,${0.15 + Math.sin(a.bubblePhase + i*1.5)*0.05})`;
        ctx.beginPath();
        ctx.arc(Math.cos(angle) * radius * 0.7, Math.sin(angle) * radius * 0.5 + 5, 3 + Math.sin(a.bubblePhase + i*2) * 1, 0, Math.PI*2);
        ctx.fill();
      }
    }

    if(a.skin === 'flame') {
      for(let i=0; i<3; i++) {
        const angle = a.bubblePhase + i * 2.1;
        const radius = 12 + Math.sin(a.bubblePhase * 0.7 + i) * 3;
        ctx.fillStyle = `rgba(255,200,50,${0.1 + Math.sin(a.bubblePhase + i*1.5)*0.05})`;
        ctx.beginPath();
        ctx.arc(Math.cos(angle) * radius * 0.5, -5 + Math.sin(angle) * radius * 0.3, 4 + Math.sin(a.bubblePhase + i*2) * 1.5, 0, Math.PI*2);
        ctx.fill();
      }
    }

    if(a.skin === 'cosmic') {
      a.bubblePhase += 0.03;
      for (let i = 0; i < 8; i++) {
        const angle = a.bubblePhase + i * 0.8;
        const dist = 6 + Math.sin(a.bubblePhase * 0.3 + i * 1.1) * 5;
        const size = 1.5 + Math.sin(a.bubblePhase * 0.5 + i * 0.7) * 1;
        const hue = (a.hue + i * 45) % 360;
        ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${0.15 + Math.sin(a.bubblePhase * 0.4 + i * 1.3) * 0.1})`;
        ctx.beginPath();
        ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist * 0.6 + 5, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.restore();
  }

  function burstAcorn() {
    if(acorns.length > 0) {
      const index = Math.floor(Math.random() * acorns.length);
      const a = acorns.splice(index, 1)[0];
      const currentX = a.x + Math.sin(a.wobble) * 3;
      const currentY = a.y + 15;

      let colors = ['#654321', '#a07346'];
      if(a.skin === 'green') colors = ['#2d5a1a', '#4a8a2a'];
      else if(a.skin === 'gold') colors = ['#b8860b', '#ffd700'];
      else if(a.skin === 'crystal') colors = ['#4a6a8a', '#8ac4d0'];
      else if(a.skin === 'flame') colors = ['#8a2a0a', '#ff4a1a'];
      else if(a.skin === 'bubble') colors = ['#2a5a3a', '#4aaa6a'];
      else if(a.skin === 'ice') colors = ['#3a6a8a', '#8ac4e0'];
      else if(a.skin === 'dark') colors = ['#2a0a3a', '#6a2a8a'];
      else if(a.skin === 'light') colors = ['#8a8a8a', '#f0f0ff'];
      else if(a.skin === 'cosmic') {
        colors = [
          `hsl(${a.hue}, 80%, 60%)`,
          `hsl(${(a.hue + 60) % 360}, 80%, 60%)`,
          `hsl(${(a.hue + 120) % 360}, 80%, 60%)`,
          `hsl(${(a.hue + 180) % 360}, 80%, 60%)`,
        ];
      } else if(a.skin === 'rainbow') {
        colors = [
          `hsl(${a.hue}, 100%, 60%)`,
          `hsl(${(a.hue + 60) % 360}, 100%, 60%)`,
          `hsl(${(a.hue + 120) % 360}, 100%, 60%)`,
          `hsl(${(a.hue + 180) % 360}, 100%, 60%)`,
        ];
      }

      fragments.push({
        x: currentX, y: currentY,
        vx: (Math.random() - 0.5) * 6,
        vy: -4 - Math.random() * 3,
        rot: Math.random() * Math.PI,
        vrot: (Math.random() - 0.5) * 0.2,
        type: 'cap',
        alpha: 1,
        color: colors[0]
      });

      for(let i=0; i<3; i++) {
        fragments.push({
          x: currentX + (Math.random()-0.5)*8,
          y: currentY + 8,
          vx: (Math.random()-0.5)*8,
          vy: -2 - Math.random()*5,
          rot: Math.random() * Math.PI,
          vrot: (Math.random()-0.5)*0.3,
          type: 'nut',
          alpha: 1,
          color: colors[i % colors.length] || colors[0]
        });
      }

      if(acorns.length < MIN_ACORN_COUNT) spawnAcornTop();
    } else {
      spawnAcornTop();
    }
  }

  function updateAndDrawEffects() {
    ctx.clearRect(0, 0, acornCanvas.width, acornCanvas.height);

    if(state === 'waiting' || state === 'playing') {
      acorns.forEach(a => drawAcorn(ctx, a));
    }

    for(let i=fragments.length-1; i>=0; i--) {
      const f = fragments[i];
      f.x += f.vx;
      f.y += f.vy;
      f.vy += 0.4;
      f.rot += f.vrot;
      f.alpha -= 0.015;

      if(f.alpha <= 0 || f.y > acornCanvas.height + 50) {
        fragments.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.globalAlpha = Math.max(0, f.alpha);
      ctx.fillStyle = f.color || '#654321';
      if(f.type === 'cap') {
        ctx.beginPath();
        ctx.arc(0, 0, 9, Math.PI, Math.PI*2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 9, 0, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    requestAnimationFrame(updateAndDrawEffects);
  }
  requestAnimationFrame(updateAndDrawEffects);

  function startAcornAutoSpawn() {
    stopAcornAutoSpawn();
    acornSpawnTimer = setInterval(() => {
      if(state === 'waiting' || state === 'playing') spawnAcornTop();
    }, 3000);
  }
  function stopAcornAutoSpawn() {
    if(acornSpawnTimer) { clearInterval(acornSpawnTimer); acornSpawnTimer = null; }
  }

  // ============ タイピングシステム ============
  function getRomajiChoices(char, isLast) {
    const map = {
      "あ":["a"],"い":["i"],"う":["u","wu"],"え":["e"],"お":["o"],
      "か":["ka","ca"],"き":["ki"],"く":["ku","cu","qu"],"け":["ke"],"こ":["ko","co"],
      "さ":["sa"],"し":["shi","si","ci"],"す":["su"],"せ":["se","ce"],"そ":["so"],
      "た":["ta"],"ち":["chi","ti"],"つ":["tsu","tu"],"て":["te"],"と":["to"],
      "な":["na"],"に":["ni"],"ぬ":["nu"],"ね":["ne"],"の":["no"],
      "は":["ha"],"ひ":["hi"],"ふ":["hu","fu"],"へ":["he"],"ほ":["ho"],
      "ま":["ma"],"み":["mi"],"む":["mu"],"め":["me"],"も":["mo"],
      "や":["ya"],"ゆ":["yu"],"よ":["yo"],
      "ら":["ra"],"り":["ri"],"る":["ru"],"れ":["re"],"ろ":["ro"],
      "わ":["wa"],"を":["wo"],
      "ん": isLast ? ["nn"] : ["nn","xn","n'","n"],
      "ー":["-","h","^"],
      "が":["ga"],"ぎ":["gi"],"ぐ":["gu"],"げ":["ge"],"ご":["go"],
      "ざ":["za"],"じ":["ji","zi"],"ず":["zu"],"ぜ":["ze"],"ぞ":["zo"],
      "だ":["da"],"ぢ":["di"],"づ":["du"],"で":["de"],"ど":["do"],
      "ば":["ba"],"び":["bi"],"ぶ":["bu"],"べ":["be"],"ぼ":["bo"],
      "ぱ":["pa"],"ぴ":["pi"],"ぷ":["pu"],"ぺ":["pe"],"ぽ":["po"],
      "きゃ":["kya"],"きゅ":["kyu"],"きょ":["kyo"],
      "しゃ":["sha","sya","silya"],"しゅ":["shu","syu"],"しょ":["sho","syo"],
      "ちゃ":["cha","cya","tya"],"ちゅ":["chu","cyu","tyu"],"ちょ":["cho","cyo","tyo"],
      "にゃ":["nya"],"にゅ":["nyu"],"にょ":["nyo"],
      "ひゃ":["hya"],"ひゅ":["hyu"],"ひょ":["hyo"],
      "みゃ":["mya"],"みゅ":["myu"],"みょ":["myo"],
      "りゃ":["rya"],"りゅ":["ryu"],"りょ":["ryo"],
      "ぎゃ":["gya"],"ぎゅ":["gyu"],"ぎょ":["gyo"],
      "じゃ":["ja","zya","jya","zilya"],"じゅ":["ju","zyu","jyu"],"じょ":["jo","zyo","jyo"],
      "びゃ":["bya"],"びゅ":["byu"],"びょ":["byo"],
      "ぴゃ":["pya"],"ぴゅ":["pyu"],"ぴょ":["pyo"],
      "ふぁ":["fa"],"ふぃ":["fi"],"ふぇ":["fe"],"ふぉ":["fo"],
      "うぃ":["wi"],"うぇ":["we"],"うぉ":["wo"],
      "てぃ":["ti","thi"],"でぃ":["di"],
      "とぅ":["twu"],"どぅ":["dwu"],
      "くぁ":["qa","kwa"],"くぃ":["qi"],"くぇ":["qe"],"くぉ":["qo"],
      "ぐぁ":["gwa"],
    };
    return map[char] || [char];
  }

  function parseKanaToUnits(str) {
    const units = [];
    let i = 0;
    while(i < str.length) {
      if (i + 2 < str.length) {
        const s = str.substr(i, 3);
        const choices = getRomajiChoices(s, false);
        if (choices.length > 0 && !(choices.length === 1 && choices[0] === s)) {
          units.push({ chars: s, isLast: false, custom: choices });
          i += 3;
          continue;
        }
      }
      if (i + 1 < str.length) {
        const s = str.substr(i, 2);
        const choices = getRomajiChoices(s, false);
        if (choices.length > 0 && !(choices.length === 1 && choices[0] === s)) {
          units.push({ chars: s, isLast: false, custom: choices });
          i += 2;
          continue;
        }
      }
      const s = str.substr(i, 1);
      if (s === "っ" && i + 1 < str.length) {
        const next = str.substr(i + 1, 1);
        const r = getRomajiChoices(next, false);
        units.push({ chars: "っ" + next, custom: r.map(x => x[0] + x), isLast: false });
        i += 2;
        continue;
      }
      const isLast = (i === str.length - 1);
      const choices = getRomajiChoices(s, isLast);
      units.push({ chars: s, isLast: isLast, custom: choices });
      i++;
    }
    return units;
  }

  const TARGET_LEN = 1000;
  const GAME_SECONDS = 60;

  function createWordItem(wordObj) {
    const units = parseKanaToUnits(wordObj.kana);
    const unitChoices = units.map((u) => {
      if (u.custom) return u.custom;
      return getRomajiChoices(u.chars, u.isLast || false);
    });
    return {
      kana: wordObj.kana,
      display: useKanji ? wordObj.kanji : wordObj.kana,
      unitChoices,
      typedLength: 0,
      activePaths: null,
      currentIndex: 0,
      typedKeys: "",
      forcedRomaji: null
    };
  }

  function buildQueue(minLen) {
    const q=[]; let total=0;
    let attempts = 0;
    while(total<minLen && attempts < 10000) {
      attempts++;
      const w=WORD_DATA[Math.floor(Math.random()*WORD_DATA.length)];
      if (!w) continue;
      const item=createWordItem(w);
      const sample=generateAllCombinations(item.unitChoices)[0];
      if (sample) {
        q.push(item);
        total += sample.length;
      }
    }
    return q;
  }

  function generateAllCombinations(unitChoices, idx=0, current="") {
    if(idx===unitChoices.length) return [current];
    const results=[];
    for(const choice of unitChoices[idx]) {
      results.push(...generateAllCombinations(unitChoices, idx+1, current+choice));
    }
    return results;
  }

  function renderWord() {
    const w=queue[qIndex];
    if (!w) { 
      queue = buildQueue(TARGET_LEN);
      qIndex = 0;
      renderWord();
      return;
    }
    kanaDisplayEl.textContent = w.display;
    if(!w.activePaths) { w.activePaths=generateAllCombinations(w.unitChoices); w.currentIndex=0; w.typedKeys=""; }
    let displayStr = w.forcedRomaji;
    if(!displayStr) {
      const matching = w.activePaths.filter(p=>p.startsWith(w.typedKeys));
      displayStr = matching.length>0 ? matching[0] : w.activePaths[0];
    }
    if (!displayStr) {
      displayStr = w.unitChoices.map(c => c[0] || '').join('');
    }
    romajiDisplayEl.innerHTML = displayStr.split('').map((ch,i)=>{
      let cls='ch-pending';
      if(i<w.typedLength) cls='ch-done';
      else if(i===w.typedLength) cls='ch-next';
      return '<span class="'+cls+'">'+ch+'</span>';
    }).join('');
  }

  function renderHud() {
    scoreValueEl.textContent = Math.floor(score);
    multiplierValueEl.textContent = '×' + (Number.isInteger(multiplier)?multiplier:multiplier.toFixed(1));
    timerEl.textContent = timeLeft;
    hudTimerEl.classList.toggle('low', timeLeft<=10);
  }

  function showPopup(text) {
    popupEl.textContent=text;
    popupEl.classList.remove('show');
    void popupEl.offsetWidth;
    popupEl.classList.add('show');
    clearTimeout(popupTimeout);
    popupTimeout=setTimeout(()=>popupEl.classList.remove('show'),900);
  }

  function updateUIVisibility() {
    const isMenu = (state === 'menu');
    const isGame = (state === 'waiting' || state === 'playing' || state === 'result');
    
    hankoBadge.classList.toggle('hidden-ui', isGame);
    topNav.classList.toggle('hidden-ui', isGame);
  }

  function initGame() {
    state='waiting';
    acorns=[];
    for(let i=0;i<MIN_ACORN_COUNT+5;i++) spawnAcornTop();
    startAcornAutoSpawn();
    queue=buildQueue(TARGET_LEN);
    qIndex=0; score=0; multiplier=1; correctTotal=0; lastMilestoneCount=0; timeLeft=GAME_SECONDS; gameTotalTyped=0;
    lastGameTyped = 0;
    lastGameDuration = 0;
    menuScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    resultOverlay.classList.remove('active');
    updateUIVisibility();
    renderWord(); renderHud();
  }

  function startTimer() {
    state='playing';
    milestoneStartTime=performance.now();
    let last10sCount = 0;
    let last10sStart = performance.now();
    
    timerInterval = setInterval(()=>{
      timeLeft--;
      renderHud();
      
      const now = performance.now();
      if (now - last10sStart >= 10000) {
        const typedIn10s = correctTotal - last10sCount;
        if (typedIn10s > max10sTyped) {
          max10sTyped = typedIn10s;
          saveData();
        }
        last10sCount = correctTotal;
        last10sStart = now;
      }
      
      if(timeLeft<=0) endGame(true);
    },1000);
  }

  function checkMilestone() {
    const diffCount=correctTotal-lastMilestoneCount;
    const diffTime=(performance.now()-milestoneStartTime)/1000;
    if(diffTime<=10 && diffCount>=50) {
      multiplier*=2; lastMilestoneCount=correctTotal; milestoneStartTime=performance.now();
      showPopup('50字達成！さらに2倍 (×'+multiplier+')');
    } else if(diffTime<=10 && diffCount>=25) {
      multiplier*=2; lastMilestoneCount=correctTotal; milestoneStartTime=performance.now();
      showPopup('25字達成！×2倍 (×'+multiplier+')');
    } else if(diffTime>10) {
      lastMilestoneCount=correctTotal; milestoneStartTime=performance.now();
    }
  }

  function handleTypingKey(key) {
    if(state==='waiting') {
      playStartSound();
      startTimer();
    }

    const word=queue[qIndex];
    if(!word) return;
    if(!word.activePaths) { word.activePaths=generateAllCombinations(word.unitChoices); word.currentIndex=0; word.typedKeys=""; }

    const possibleNext=new Set();
    word.activePaths.forEach(p=>{ if(p && p.length>word.currentIndex) possibleNext.add(p[word.currentIndex]); });

    if(possibleNext.has(key.toLowerCase())) {
      playTypedSound();
      
      burstAcorn();
      word.currentIndex++;
      word.typedLength=Math.min(word.currentIndex, word.activePaths[0] ? word.activePaths[0].length : 0);
      word.typedKeys += key.toLowerCase();
      word.activePaths=word.activePaths.filter(p=>p && p.startsWith(word.typedKeys));
      if(word.activePaths.length>0) word.forcedRomaji=word.activePaths[0];

      const isCompleted = word.activePaths.some(p=>p===word.typedKeys) || word.currentIndex>= (word.forcedRomaji ? word.forcedRomaji.length : 0);
      correctTotal++; score += multiplier; gameTotalTyped++;
      checkMilestone();

      if(isCompleted || word.activePaths.length===0) {
        qIndex++;
        if(queue.length-qIndex<6) queue=queue.concat(buildQueue(200));
      }
      renderWord(); renderHud();
    } else {
      wordStageEl.classList.remove('shake');
      void wordStageEl.offsetWidth;
      wordStageEl.classList.add('shake');
    }
  }

  function endGame(save) {
    if(timerInterval) { clearInterval(timerInterval); timerInterval=null; }
    stopAcornAutoSpawn();
    
    if (save) {
      lastGameTyped = gameTotalTyped;
      lastGameDuration = 60 - timeLeft;
    }
    
    state='result';
    gameScreen.classList.add('hidden');

    if(save) {
      const finalScore=Math.floor(score);
      modalScoreEl.textContent=finalScore;
      modalBadgeContainer.innerHTML='';

      totalTyped += gameTotalTyped;
      updateTotalTypedDisplay();

      if(finalScore>highscore) {
        highscore=finalScore;
        highscoreValueEl.textContent=highscore;
        const badge=document.createElement('div');
        badge.className='result-badge-record';
        badge.textContent='🏆 最新記録！';
        modalBadgeContainer.appendChild(badge);
      }
      
      playResultSound();
      
      checkAchievements();
      
      saveData();
      resultOverlay.classList.add('active');
      updateUIVisibility();
    } else {
      state='menu';
      menuScreen.classList.remove('hidden');
      startAcornAutoSpawn();
      updateUIVisibility();
    }
  }

  // ============ UI更新 ============
  function updateTotalTypedDisplay() {
    totalTypedDisplayEl.textContent = '入力:' + totalTyped + '字';
  }

  function updateShopUI() {
    shopHighscoreEl.textContent = highscore;
    shopTotalTypedEl.textContent = totalTyped;
    renderShopItems();
  }

  function renderShopItems() {
    let html = '';

    html += '<div class="shop-section-title">🌄 背景スキン</div>';
    html += '<div class="shop-items">';
    for(const [id, skin] of Object.entries(BG_SKINS)) {
      const owned = ownedBg.includes(id);
      const equipped = equippedBg === id;
      const canBuy = (skin.priceType === 'score' && highscore >= skin.price) ||
                     (skin.priceType === 'typed' && totalTyped >= skin.price) ||
                     skin.priceType === 'none';
      const priceLabel = skin.priceType === 'none' ? '初期' :
                         skin.priceType === 'score' ? '🏆'+skin.price : '📝'+skin.price;

      html += `<div class="shop-item ${owned?'owned':''} ${equipped?'equipped':''}">
        <div class="shop-item-info">
          <div class="shop-item-name">${skin.name} ${equipped?' ✅':''}</div>
          <div class="shop-item-desc">${skin.desc}</div>
        </div>
        <div class="shop-item-price">${priceLabel}</div>
        <button class="shop-item-btn ${equipped?'equip-btn':owned?'owned-btn':''}" 
                data-type="bg" data-id="${id}" ${(!owned && !canBuy) ? 'disabled':''}>
          ${equipped ? '装備中' : owned ? '装備' : '購入'}
        </button>
      </div>`;
    }
    html += '</div>';

    html += '<div class="shop-section-title">🌰 どんぐりスキン</div>';
    html += '<div class="shop-items">';
    for(const [id, skin] of Object.entries(ACORN_SKINS)) {
      const owned = ownedAcorn.includes(id);
      const equipped = equippedAcorn === id;
      const canBuy = (skin.priceType === 'score' && highscore >= skin.price) ||
                     (skin.priceType === 'typed' && totalTyped >= skin.price) ||
                     skin.priceType === 'none';
      const priceLabel = skin.priceType === 'none' ? '初期' :
                         skin.priceType === 'score' ? '🏆'+skin.price : '📝'+skin.price;

      html += `<div class="shop-item ${owned?'owned':''} ${equipped?'equipped':''}">
        <div class="shop-item-info">
          <div class="shop-item-name">${skin.name} ${equipped?' ✅':''}</div>
          <div class="shop-item-desc">${skin.desc}</div>
        </div>
        <div class="shop-item-price">${priceLabel}</div>
        <button class="shop-item-btn ${equipped?'equip-btn':owned?'owned-btn':''}" 
                data-type="acorn" data-id="${id}" ${(!owned && !canBuy) ? 'disabled':''}>
          ${equipped ? '装備中' : owned ? '装備' : '購入'}
        </button>
      </div>`;
    }
    html += '</div>';

    shopItemsContainer.innerHTML = html;

    shopItemsContainer.querySelectorAll('.shop-item-btn').forEach(btn => {
      btn.addEventListener('click', handleShopAction);
    });
  }

  function handleShopAction(e) {
    const btn = e.currentTarget;
    const type = btn.dataset.type;
    const id = btn.dataset.id;

    if(type === 'bg') {
      if(ownedBg.includes(id)) {
        equippedBg = id;
        saveData();
        updateShopUI();
        return;
      }
      const skin = BG_SKINS[id];
      if(skin.priceType === 'score' && highscore >= skin.price) {
        highscore -= skin.price;
        ownedBg.push(id);
        equippedBg = id;
        saveData();
        updateShopUI();
        highscoreValueEl.textContent = highscore;
      } else if(skin.priceType === 'typed' && totalTyped >= skin.price) {
        totalTyped -= skin.price;
        ownedBg.push(id);
        equippedBg = id;
        saveData();
        updateShopUI();
        updateTotalTypedDisplay();
      }
    } else if(type === 'acorn') {
      if(ownedAcorn.includes(id)) {
        equippedAcorn = id;
        saveData();
        updateShopUI();
        return;
      }
      const skin = ACORN_SKINS[id];
      if(skin.priceType === 'score' && highscore >= skin.price) {
        highscore -= skin.price;
        ownedAcorn.push(id);
        equippedAcorn = id;
        saveData();
        updateShopUI();
        highscoreValueEl.textContent = highscore;
      } else if(skin.priceType === 'typed' && totalTyped >= skin.price) {
        totalTyped -= skin.price;
        ownedAcorn.push(id);
        equippedAcorn = id;
        saveData();
        updateShopUI();
        updateTotalTypedDisplay();
      }
    }
  }

  // ============ 設定関連 ============
  function updateSettingsUI() {
    soundTypedInput.value = soundTyped;
    soundStartInput.value = soundStart;
    soundResultInput.value = soundResult;
    
    const statuses = ['typed', 'start', 'result'];
    for (const type of statuses) {
      const statusEl = document.getElementById('status-' + type);
      const url = document.getElementById('sound-' + type).value.trim();
      if (url) {
        statusEl.textContent = '📁 外部ファイル設定済み';
        statusEl.className = 'sound-status success';
      } else {
        statusEl.textContent = '🎵 デフォルト音声を使用中';
        statusEl.className = 'sound-status';
      }
    }
  }

  // ============ イベントリスナー ============
  document.getElementById('achievement-open-btn').addEventListener('click', () => {
    updateAchievementUI();
    achievementOverlay.classList.add('active');
  });
  document.getElementById('achievement-close-btn').addEventListener('click', () => {
    achievementOverlay.classList.remove('active');
  });
  achievementOverlay.addEventListener('click', (e) => {
    if(e.target === achievementOverlay) achievementOverlay.classList.remove('active');
  });

  document.getElementById('shop-open-btn').addEventListener('click', () => {
    updateShopUI();
    shopOverlay.classList.add('active');
  });
  document.getElementById('shop-close-btn').addEventListener('click', () => {
    shopOverlay.classList.remove('active');
  });
  shopOverlay.addEventListener('click', (e) => {
    if(e.target === shopOverlay) shopOverlay.classList.remove('active');
  });

  document.getElementById('settings-open-btn').addEventListener('click', () => {
    updateSettingsUI();
    settingsOverlay.classList.add('active');
  });
  document.getElementById('settings-close-btn').addEventListener('click', () => {
    settingsOverlay.classList.remove('active');
  });
  settingsOverlay.addEventListener('click', (e) => {
    if(e.target === settingsOverlay) settingsOverlay.classList.remove('active');
  });

  document.querySelectorAll('.sound-exec-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const type = btn.dataset.sound;
      const input = document.getElementById('sound-' + type);
      const url = input.value.trim();
      await applySoundSetting(type, url);
    });
  });

  [soundTypedInput, soundStartInput, soundResultInput].forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const type = input.id.replace('sound-', '');
        const url = input.value.trim();
        applySoundSetting(type, url);
      }
    });
  });

  settingDisplayBtn.addEventListener('click', () => {
    useKanji = !useKanji;
    settingDisplayBtn.textContent = useKanji ? "漢字" : "ひらがな";
    saveData();
  });

  resetDataBtn.addEventListener('click', () => {
    if(confirm('すべてのデータを削除しますか？')) {
      localStorage.removeItem('donguri_data');
      const d = { ...DEFAULT_DATA };
      highscore=d.highscore; totalTyped=d.totalTyped; useKanji=d.useKanji;
      equippedBg=d.equippedBg; equippedAcorn=d.equippedAcorn;
      ownedBg=d.ownedBg; ownedAcorn=d.ownedAcorn;
      unlockedAchievements=d.unlockedAchievements;
      max10sTyped=d.max10sTyped;
      soundTyped=d.soundTyped; soundStart=d.soundStart; soundResult=d.soundResult;
      highscoreValueEl.textContent='0';
      updateTotalTypedDisplay();
      settingDisplayBtn.textContent='ひらがな';
      settingsOverlay.classList.remove('active');
      updateSettingsUI();
      saveData();
      updateAchievementUI();
      soundBuffers = { typed: null, start: null, result: null };
      for (const type of ['typed', 'start', 'result']) {
        const buf = generateDefaultSound(type);
        if (buf) soundBuffers[type] = buf;
      }
    }
  });

  hankoBadge.addEventListener('click', () => {
    updateShopUI();
    shopOverlay.classList.add('active');
  });

  document.addEventListener('keydown', (e) => {
    if(shopOverlay.classList.contains('active') || 
       settingsOverlay.classList.contains('active') ||
       achievementOverlay.classList.contains('active')) {
      if(e.key === 'Escape') {
        e.preventDefault();
        shopOverlay.classList.remove('active');
        settingsOverlay.classList.remove('active');
        achievementOverlay.classList.remove('active');
      }
      return;
    }

    if(state === 'menu') {
      if(e.code === 'Space') { e.preventDefault(); initGame(); }
      return;
    }
    if(state === 'result') {
      if(e.code === 'Space') {
        e.preventDefault();
        resultOverlay.classList.remove('active');
        initGame();
      } else if(e.key === 'Escape') {
        e.preventDefault();
        resultOverlay.classList.remove('active');
        state='menu';
        menuScreen.classList.remove('hidden');
        startAcornAutoSpawn();
        updateUIVisibility();
      }
      return;
    }
    if(state === 'waiting' || state === 'playing') {
      if(e.key === 'Escape') { e.preventDefault(); endGame(false); return; }
      if(e.code === 'Space') e.preventDefault();
      if(e.key.length === 1 && /[a-zA-Z-]/.test(e.key)) {
        handleTypingKey(e.key);
      }
    }
  });

  // ============ 初期化 ============
  function init() {
    const data = loadData();
    highscore = data.highscore;
    totalTyped = data.totalTyped;
    useKanji = data.useKanji;
    equippedBg = data.equippedBg;
    equippedAcorn = data.equippedAcorn;
    ownedBg = data.ownedBg;
    ownedAcorn = data.ownedAcorn;
    unlockedAchievements = data.unlockedAchievements || [];
    max10sTyped = data.max10sTyped || 0;
    soundTyped = data.soundTyped || '';
    soundStart = data.soundStart || '';
    soundResult = data.soundResult || '';

    highscoreValueEl.textContent = highscore;
    updateTotalTypedDisplay();
    settingDisplayBtn.textContent = useKanji ? "漢字" : "ひらがな";
    startAcornAutoSpawn();
    updateUIVisibility();
    updateAchievementUI();
    
    initAudio();
    
    for (const type of ['typed', 'start', 'result']) {
      const defaultBuf = generateDefaultSound(type);
      if (defaultBuf) soundBuffers[type] = defaultBuf;
    }
    
    setTimeout(async () => {
      if (soundTyped) {
        const buf = await loadSound(soundTyped);
        if (buf) soundBuffers.typed = buf;
      }
      if (soundStart) {
        const buf = await loadSound(soundStart);
        if (buf) soundBuffers.start = buf;
      }
      if (soundResult) {
        const buf = await loadSound(soundResult);
        if (buf) soundBuffers.result = buf;
      }
      updateSettingsUI();
    }, 200);
    
    checkAchievements();
  }

  init();
})();
</script>
</body>
